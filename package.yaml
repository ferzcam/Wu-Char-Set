# This YAML file describes your package. Stack will automatically generate a
# Cabal file when you run `stack build`. See the hpack website for help with
# this file: <https://github.com/sol/hpack>.
name: Wu-Char-Set
version: '0.0.0'
github: "ferynando7/Wu-Char-Set"
license: MIT
author: "Fernando Zhapa"
maintainer: "Fernando Zhapa"

extra-source-files:
- CHANGELOG.md
- package.yaml
- README.md
- stack.yaml

ghc-options: -Wall

library:
  source-dirs: library
  dependencies:
  - base
  - containers
  - vector
  - random
  - random-shuffle

executables:
  Wu-Char-Set:
    source-dirs: executable
    main: Main.hs
    dependencies:
    - base
    - containers
    - Wu-Char-Set
    - random
    - random-shuffle
    - time
    - directory
    - filepath
    ghc-options:
    - -rtsopts
    - -threaded
    - -with-rtsopts=-N

benchmarks:
  Wu-Char-Set-benchmarks:
    source-dirs: benchmark
    main: Main.hs
    dependencies:
    - base
    - Wu-Char-Set
    - criterion
    ghc-options:
    - -rtsopts
    - -threaded
    - -with-rtsopts=-N

tests:
  Wu-Char-Set-test-suite:
    source-dirs: test-suite
    main: Main.hs
    dependencies:
    - base
    - Wu-Char-Set
    - tasty
    - tasty-hunit
    - containers
    ghc-options:
    - -rtsopts
    - -threaded
    - -with-rtsopts=-N
