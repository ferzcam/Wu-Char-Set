# This YAML file describes your package. Stack will automatically generate a
# Cabal file when you run `stack build`. See the hpack website for help with
# this file: <https://github.com/sol/hpack>.
name: Wu-Char-Set
version: '0.0.0'
github: "ferzcam/Wu-Char-Set"
license: MIT
author: "Fernando Zhapa"
maintainer: "Fernando Zhapa"
# synopsis: A new Haskeleton package.
# description: Wu-Char-Set is a new Haskeleton package.
# category: Other

extra-source-files:
- CHANGELOG.md
- LICENSE
- package.yaml
- README.md
- stack.yaml

ghc-options: -Wall

library:
  source-dirs: library
  dependencies:
  - base >=4.7 && <5
  - containers
  - halg-core
  - halg-polynomials
  - algebra
  - sized
  - type-natural
  - matrix
  - random
  - random-shuffle
  
  exposed-modules:
    - Core
    - Example

  ghc-options:
    - -freverse-errors


executables:
  Wu-Char-Set:
    source-dirs: executable
    main: Main.hs
    dependencies:
    - base
    - Wu-Char-Set
    - random
    - random-shuffle
    
    ghc-options:
      - -freverse-errors


  
benchmarks:
  Wu-Char-Set-benchmarks:
    source-dirs: benchmark
    main: Main.hs
    dependencies:
    - base
    - criterion

    ghc-options:
      - -freverse-errors


  
tests:
  Wu-Char-Set-test-suite:
    source-dirs: test-suite
    main: Main.hs
    dependencies:
    - base
    - tasty
    - tasty-hspec
    - tasty-hunit

    ghc-options:
      - -freverse-errors

